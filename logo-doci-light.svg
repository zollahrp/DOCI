<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="100%" height="100%">
  <defs>
    <linearGradient id="chickGradientL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="techWingL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <filter id="cleanShadowL" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- ICON MARK -->
  <g transform="translate(30, 20)" filter="url(#cleanShadowL)">
    <rect x="0" y="0" width="140" height="140" rx="36" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Minimalist Baby Chick Silhouette -->
    <path d="M 40 100 C 35 70, 52 42, 80 42 C 98 42, 112 56, 112 74 C 112 88, 102 98, 88 102 C 68 107, 48 106, 40 100 Z" fill="url(#chickGradientL)" />

    <!-- Beak -->
    <path d="M 112 68 L 126 75 L 112 82 Z" fill="#F97316" />

    <!-- Eye -->
    <circle cx="94" cy="62" r="5.5" fill="#0B1D38" />
    <circle cx="96" cy="60" r="2" fill="#FFFFFF" />

    <!-- Minimalist Wing -->
    <path d="M 48 94 C 60 76, 84 76, 98 90 C 82 100, 60 102, 48 94 Z" fill="url(#techWingL)" />

    <!-- Pulse Dot -->
    <circle cx="106" cy="94" r="3.5" fill="#0284C7" />
  </g>

  <!-- CLEAN MODERN TYPOGRAPHY FOR LIGHT BACKGROUND -->
  <g transform="translate(200, 32)">
    <text x="0" y="62" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" fill="#0B1D38">
      DOC<tspan fill="#F59E0B">I</tspan>
    </text>

    <text x="2" y="92" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#0284C7">
      DOC INTELLIGENCE ASSISTANT
    </text>

    <g transform="translate(2, 104)">
      <rect x="0" y="0" width="280" height="24" rx="12" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1" />
      <text x="14" y="16" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#D97706">
        Transparan • Cerdas • Berkelanjutan
      </text>
    </g>
  </g>
</svg>
