<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="100%" height="100%">
  <defs>
    <!-- Warm Chick Gradient -->
    <linearGradient id="chickGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Sleek Tech Wing Gradient -->
    <linearGradient id="techWing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="cleanShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ICON MARK (Minimalist, Geometric, Professional) -->
  <g transform="translate(30, 20)" filter="url(#cleanShadow)">
    <!-- Sleek Navy Hexagon/Circle Container -->
    <rect x="0" y="0" width="140" height="140" rx="36" fill="#0B1D38" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2" />
    
    <!-- Minimalist Baby Chick Silhouette -->
    <!-- Head and Body combined in a single continuous elegant organic curve -->
    <path d="M 40 100 C 35 70, 52 42, 80 42 C 98 42, 112 56, 112 74 C 112 88, 102 98, 88 102 C 68 107, 48 106, 40 100 Z" fill="url(#chickGradient)" />

    <!-- Cute Beak -->
    <path d="M 112 68 L 126 75 L 112 82 Z" fill="#F97316" />

    <!-- Friendly Eye Dot -->
    <circle cx="94" cy="62" r="5.5" fill="#0B1D38" />
    <circle cx="96" cy="60" r="2" fill="#FFFFFF" />

    <!-- Minimalist Dynamic Wing (Smart Data Swoop) -->
    <path d="M 48 94 C 60 76, 84 76, 98 90 C 82 100, 60 102, 48 94 Z" fill="url(#techWing)" />

    <!-- Single AI Intelligence Pulse Dot -->
    <circle cx="106" cy="94" r="3.5" fill="#00F2FE" />
  </g>

  <!-- CLEAN MODERN TYPOGRAPHY (Startup Style) -->
  <g transform="translate(200, 32)">
    <!-- DOCI Brand Name -->
    <text x="0" y="62" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" fill="#FFFFFF">
      DOC<tspan fill="#F59E0B">I</tspan>
    </text>

    <!-- Subtitle: DOC Intelligence Assistant -->
    <text x="2" y="92" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#38BDF8">
      DOC INTELLIGENCE ASSISTANT
    </text>

    <!-- Tagline Badge -->
    <g transform="translate(2, 104)">
      <rect x="0" y="0" width="280" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
      <text x="14" y="16" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#FBBF24">
        Transparan • Cerdas • Berkelanjutan
      </text>
    </g>
  </g>
</svg>
